name: MATLAB tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2022b
      - uses: matlab-actions/run-command@v3
        with:
          command: addpath('utilities'); results = runtests('tests'); assertSuccess(results);
